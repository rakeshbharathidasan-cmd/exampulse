<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ExamPulse</title>
<meta name="theme-color" content="#07081a">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ExamPulse · exam preparation tracker. Aurora Pulse. */
:root{
  --bg:#07081a; --s1:#10122b; --s2:#171a3a; --s3:#22264f; --line:#262b58; --line2:#353b72;
  --text:#f1f2ff; --muted:#a3a8d6; --faint:#646a9e;
  --cyan:#2ec5ff; --vio:#7c5cff; --pink:#ff4fa3; --grad:linear-gradient(135deg,#ff4fa3,#7c5cff 50%,#2ec5ff);
  --up:#2ee59d; --dn:#ff5d73; --gold:#ffc54d;
  --disp:'Sora',system-ui,sans-serif; --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@font-face{font-family:'Emo';src:local('Noto Color Emoji'),local('Apple Color Emoji'),local('Segoe UI Emoji'),local('SamsungColorEmoji');unicode-range:U+2600-27BF,U+1F000-1FAFF,U+FE0F,U+200D,U+2B50,U+2705,U+23F0}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14.5px/1.45 var(--body),'Emo';max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px calc(env(safe-area-inset-bottom,0px) + 98px);user-select:none;min-height:100vh}
body::before{content:"";position:fixed;inset:-25%;z-index:-1;pointer-events:none;background:radial-gradient(34% 26% at 8% 10%,color-mix(in srgb,var(--vio) 30%,transparent),transparent 70%),radial-gradient(30% 24% at 95% 28%,color-mix(in srgb,var(--cyan) 16%,transparent),transparent 70%),radial-gradient(32% 26% at 30% 92%,color-mix(in srgb,var(--pink) 13%,transparent),transparent 70%);animation:aur 20s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate(-5%,4%) rotate(4deg) scale(1.06)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;width:100%;color-scheme:dark;user-select:text}
textarea{min-height:70px;resize:vertical}
.num{font-variant-numeric:tabular-nums}.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12.5px}
.up{color:var(--up)}.dn{color:var(--dn)}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:38px;height:38px;border-radius:13px;background:var(--grad);display:grid;place-items:center;box-shadow:0 0 22px -4px var(--vio);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:2px solid var(--cyan);opacity:0;animation:sonar 3.6s ease-out infinite}
.mark svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round}
.brand b{display:block;font-family:var(--disp);font-weight:800;font-size:20px;letter-spacing:1.6px;background:linear-gradient(90deg,var(--cyan),var(--vio),var(--pink),var(--cyan));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 6s linear infinite}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-1px;white-space:nowrap}
@keyframes shim{to{background-position:300% 0}}
.hb{display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--s1);border:1px solid var(--line);color:var(--muted);position:relative;flex:none}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:active{transform:scale(.92)}
.wbadge{position:absolute;top:3px;right:3px;min-width:15px;height:15px;border-radius:8px;background:var(--pink);color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 3px}

/* cards */
.card{background:linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.012)),var(--s1);border:1px solid color-mix(in srgb,var(--vio) 22%,transparent);border-radius:24px;padding:14px;margin-bottom:12px;position:relative;box-shadow:0 18px 40px -28px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ch h3{margin:0;font-size:11.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.ch span,.ch button.lnk{font-size:11.5px;color:var(--faint)}
.lnk{color:var(--cyan)!important;font-weight:700}
#view>*{animation:rise .45s both}#view>*:nth-child(2){animation-delay:.04s}#view>*:nth-child(3){animation-delay:.08s}#view>*:nth-child(4){animation-delay:.12s}#view>*:nth-child(5){animation-delay:.16s}
#view.l>*{animation-name:slideL}#view.r>*{animation-name:slideR}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes slideL{from{opacity:0;transform:translateX(-26px)}}
@keyframes slideR{from{opacity:0;transform:translateX(26px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes sonar{0%{transform:scale(.92);opacity:.7}100%{transform:scale(1.45);opacity:0}}

/* hero ring */
.hero{padding:14px 14px 14px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(260px 220px at 50% 38%,color-mix(in srgb,var(--rc,var(--vio)) 22%,transparent),transparent 70%);pointer-events:none;transition:background .6s}
.ringw{position:relative;width:236px;height:236px;margin:2px auto 4px}
.ringw .son{position:absolute;inset:18px;border-radius:50%;border:2px solid var(--cyan);opacity:0;animation:sonar 3.6s ease-out infinite;pointer-events:none}
.ringw .son.b{border-color:var(--vio);animation-delay:1.2s}.ringw .son.c{border-color:var(--pink);animation-delay:2.4s}
.ringw.idle .son,.ringw.paused .son{animation-play-state:paused;opacity:0}
.ringw svg{width:100%;height:100%;overflow:visible;display:block}
.arc{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)}
.live{animation:glowp 1.6s ease-in-out infinite}
@keyframes glowp{50%{opacity:.75}}
.head{animation:headp 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes headp{50%{transform:scale(1.35)}}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.rc .k{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.rc .t{font-family:var(--disp);font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;font-variant-numeric:tabular-nums}
.rc .t small{font-size:22px;color:var(--muted);letter-spacing:0}
.rc .s{font-size:12px;color:var(--muted);margin-top:2px}
.nowpill{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:5px 12px;border-radius:99px;background:color-mix(in srgb,var(--c) 20%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:#fff;box-shadow:0 0 18px -6px var(--c)}
.nowpill i{width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);animation:glowp 1s infinite}
.paused .nowpill{opacity:.6}
.eta{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:8px 0 12px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--ec,var(--cyan)) 13%,var(--s2));border:1px solid color-mix(in srgb,var(--ec,var(--cyan)) 45%,transparent);font-size:13.5px;line-height:1.35}
.eta .ei{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--ec,var(--cyan)) 25%,transparent);flex:none}
.eta b{color:var(--ec,var(--cyan))}
.eta .go{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}
.ctl{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px}
.cb{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 6px;border-radius:16px;font-weight:800;font-size:14px;background:var(--s2);border:1px solid var(--line2);transition:transform .12s}
.cb:active{transform:scale(.95)}
.cb svg{width:16px;height:16px;fill:currentColor}
.cb.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 12px 26px -12px var(--vio);position:relative;overflow:hidden}
.cb.pri::after,.btn.pri::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 3.4s ease-in-out infinite;pointer-events:none}
@keyframes sheen{60%,100%{transform:translateX(120%)}}
.cb.go{background:linear-gradient(135deg,#2ee59d,#12b878);color:#04140c;border:0;box-shadow:0 10px 24px -12px #2ee59d}
.cb:disabled{opacity:.4}
.banner{padding:11px 12px;border-radius:16px;margin-bottom:12px;background:color-mix(in srgb,var(--gold) 14%,var(--s1));border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);font-size:13px}
.banner .acts{margin-top:8px}

/* step tiles */
.tg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tl{position:relative;overflow:hidden;text-align:left;border-radius:19px;padding:10px 9px 9px;min-height:86px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) calc(var(--tp,100%) * .95),transparent),color-mix(in srgb,color-mix(in srgb,var(--c) 45%,#0b0c22) var(--tp,100%),transparent));
  box-shadow:0 10px 22px -14px var(--c),inset 0 1px 0 rgba(255,255,255,.22);transition:transform .15s;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.tl::before{content:"";position:absolute;inset:0;background:radial-gradient(110px 70px at 0 0,rgba(255,255,255,.26),transparent 70%);pointer-events:none}
.tl::after{content:"";position:absolute;width:70px;height:70px;right:-24px;bottom:-28px;border-radius:50%;border:10px solid rgba(255,255,255,.09);pointer-events:none}
.tl:active{transform:scale(.94)}
.tl>*{position:relative;z-index:1}
.tl .e{font-size:22px;line-height:1}
.tl .n{font-size:12px;font-weight:800;line-height:1.15;margin-top:5px}
.tl .m{font-size:11.5px;font-weight:700;opacity:.92;font-variant-numeric:tabular-nums}
.tl .m small{font-weight:600;opacity:.8}
.tl .pb{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85);border-radius:0 3px 3px 0;z-index:2;transition:width 1s linear}
.tl.done{filter:saturate(.55) brightness(.8)}
.tl.done .ck{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.9);color:#10122b;display:grid;place-items:center;font-size:11px;font-weight:900;z-index:2;animation:pop .4s both}
.tl.act{outline:2px solid rgba(255,255,255,.95);outline-offset:-2px;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 12px 30px -8px var(--c);transform:translateY(-2px)}
.tl.act .lv{position:absolute;top:7px;right:7px;font-size:8.5px;font-weight:900;letter-spacing:.6px;padding:2px 6px;border-radius:99px;background:rgba(0,0,0,.35);z-index:2}
.tl.act .lv::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin-right:4px;vertical-align:1px;animation:glowp 1s infinite}
.tl.noest .m::after{content:" · not in ETA";font-weight:600;opacity:.7}
.tl.add{background:var(--s1);border:1.5px dashed var(--line2);box-shadow:none;color:var(--muted);align-items:flex-start}
.tl.add::before,.tl.add::after{display:none}
.lt{color:#10131a!important}

/* strip */
.strip{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--s3);margin:2px 0 8px}
.strip i{display:block;height:100%;transform-origin:left;animation:growx .8s cubic-bezier(.2,.9,.3,1) both;border-right:1.5px solid var(--s1)}
@keyframes growx{from{transform:scaleX(0)}}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* list rows */
.lap{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.lap:last-child{border-bottom:0}
.lap .e{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.lap .n{font-weight:700;font-size:14px}.lap .s{font-size:11.5px;color:var(--faint)}
.lap .v{text-align:right;font-family:var(--disp);font-weight:700;font-variant-numeric:tabular-nums}
.lap .v small{display:block;font-family:var(--body);font-size:11px;font-weight:700}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{border-radius:18px;padding:11px 12px;background:linear-gradient(150deg,color-mix(in srgb,var(--c,var(--vio)) 22%,var(--s2)),var(--s1));border:1px solid color-mix(in srgb,var(--c,var(--vio)) 35%,transparent);min-width:0;animation:pop .45s both}
.kpi .k{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--muted);text-transform:uppercase}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--faint)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:8px 4px;border-radius:10px;font-weight:800;color:var(--muted);font-size:13px;transition:all .2s}
.seg button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px -8px var(--vio)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.gb{transform-box:fill-box;transform-origin:50% 100%;animation:growy .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes growy{from{transform:scaleY(0)}}
.draw{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 1.3s .1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sb{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;gap:8px;align-items:center;padding:6px 0;font-size:13px}
.sb .tr{height:10px;border-radius:99px;background:var(--s3);overflow:hidden}
.sb .tr b{display:block;height:100%;border-radius:99px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.9,.3,1) both}
.sb .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.ins div{font-size:13px;padding:9px 12px;border-radius:13px;background:var(--s2);border-left:3px solid var(--c,var(--vio));margin-top:7px}

/* calendar */
.pnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.pnav h2{margin:0;text-align:center;font-family:var(--disp);font-size:18px}.pnav h2 small{display:block;font-family:var(--body);font-size:11.5px;color:var(--muted);font-weight:600}
.dow,.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow div{text-align:center;font-size:10.5px;color:var(--faint);font-weight:800;padding-bottom:4px}
.cd{aspect-ratio:1/1.15;border-radius:12px;background:var(--s2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0;animation:pop .4s both}
.cd.has{background:color-mix(in srgb,var(--c) 26%,var(--s2));border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.cd.blank{background:none;border:0;animation:none}.cd.fut{opacity:.3}.cd.td{box-shadow:0 0 0 2px var(--cyan)}.cd.sel{box-shadow:0 0 0 2px var(--pink)}
.cd .n{position:absolute;top:3px;left:5px;font-size:9.5px;color:var(--muted);font-weight:700}
.cd .v{font-family:var(--disp);font-size:12px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums}
.cgrid.fl{animation:flipm .45s both}@keyframes flipm{from{transform:perspective(600px) rotateX(-70deg);opacity:0}}

/* records */
.rec{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line)}
.rec:last-child{border:0}
.rec .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:color-mix(in srgb,var(--c) 22%,var(--s2))}
.rec .v{font-family:var(--disp);font-weight:800;font-size:17px;text-align:right}.rec .v small{display:block;font-family:var(--body);font-size:11px;color:var(--faint);font-weight:600}
.trophy{text-align:center;padding:6px 0 4px}.trophy .big{font-size:54px;animation:float 3s ease-in-out infinite;display:inline-block}
@keyframes float{50%{transform:translateY(-6px)}}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
.tb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);font-size:11px;font-weight:700}
.tb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.tb.on{color:var(--text)}.tb.on svg{color:var(--cyan);filter:drop-shadow(0 0 7px color-mix(in srgb,var(--cyan) 80%,transparent));transform:translateY(-2px) scale(1.12)}
.fab{width:60px;height:60px;margin:-28px auto 0;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--grad);box-shadow:0 0 0 5px var(--bg),0 10px 30px -6px var(--vio);animation:fabg 3s ease-in-out infinite;transition:transform .2s}
.fab svg{width:26px;height:26px;fill:#fff}
.fab:active{transform:scale(.9) rotate(20deg)}
@keyframes fabg{50%{box-shadow:0 0 0 5px var(--bg),0 0 36px 4px color-mix(in srgb,var(--vio) 75%,transparent)}}

/* sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(3,2,12,.62);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;overscroll-behavior:contain;background:linear-gradient(180deg,color-mix(in srgb,var(--vio) 12%,var(--s1)),var(--s1));border:1px solid var(--line2);border-bottom:0;border-top-color:var(--vio);border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s .32s;box-shadow:0 -20px 50px -20px color-mix(in srgb,var(--vio) 60%,transparent)}
.sheet .grab{width:42px;height:5px;border-radius:99px;background:var(--line2);margin:0 auto 12px}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet h3{margin:0 0 12px;font-family:var(--disp);font-size:19px}
.sheet h4{margin:16px 0 6px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.btn{display:block;width:100%;padding:13px;border-radius:15px;background:var(--s2);border:1px solid var(--line2);font-weight:800;text-align:center;transition:transform .12s;position:relative;overflow:hidden}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 26px -12px var(--vio)}
.btn.danger{color:var(--dn)}
.btn.sm{display:inline-block;width:auto;padding:7px 11px;font-size:12px;border-radius:10px}
.btn.armed{background:var(--dn);color:#fff;border-color:var(--dn)}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
.note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.45}
.fl{font-size:11.5px;color:var(--muted);font-weight:700;margin:12px 2px 5px}
.tg2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;border-radius:99px;background:var(--s3);transition:background .2s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#c9cdf0;transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.sw input:checked+span{background:var(--grad)}.sw input:checked+span::after{transform:translateX(20px);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 11px;border-radius:99px;background:var(--s2);border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--muted)}
.chip.on{color:#fff;background:var(--grad);border-color:transparent}
/* step editor */
.se{display:grid;grid-template-columns:42px minmax(0,1fr) 36px 30px 30px;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.se .em{width:42px;height:42px;border-radius:12px;font-size:21px;background:color-mix(in srgb,var(--c) 25%,var(--s2));border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.se input[type=color]{width:36px;height:36px;padding:2px;border-radius:10px}
.se .mv{width:30px;height:30px;border-radius:9px;background:var(--s2);color:var(--muted);font-size:14px}
.se2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:-2px 0 4px 48px;font-size:12px;color:var(--muted)}
.se2 label{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;background:var(--s2)}
.se2 input[type=checkbox]{width:16px;height:16px;accent-color:var(--cyan);padding:0}
.se2 input[type=number]{width:62px;padding:4px 6px;font-size:12px;border-radius:8px}
.se2 button{padding:4px 9px;border-radius:99px;background:var(--s2);color:var(--dn)}
.esel{display:grid;grid-template-columns:30px minmax(0,1fr) auto 48px;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line)}
.esel .e{font-size:20px}
/* look panel */
.thg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:6px 0 4px}
.thg button{border-radius:13px;padding:9px 6px 7px;border:1px solid var(--line2);font-size:11.5px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:5px}
.thg button.on{box-shadow:0 0 0 2px var(--cyan)}
.thg .sw2{display:flex;gap:3px}.thg .sw2 i{width:13px;height:13px;border-radius:50%;display:block}
.lrow{padding:9px 0;border-bottom:1px solid var(--line)}
.lrow .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;font-weight:700}
.lrow .c{display:grid;grid-template-columns:46px minmax(0,1fr) 40px;gap:8px;align-items:center;margin-top:7px}.lrow .c.c2{grid-template-columns:minmax(0,1fr) 40px}
.lrow input[type=color]{width:46px;height:32px;padding:2px;border-radius:9px}
.lrow input[type=range]{padding:0;border:0;background:none;accent-color:var(--cyan)}
.lrow small{color:var(--muted);text-align:right}
.shp{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.shp button{font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;background:var(--s2);border:1px solid var(--line2);color:var(--muted)}
.shp button.on{background:var(--grad);color:#fff;border-color:transparent}.shp button i{display:inline-block;width:15px;height:10px;border:2px solid currentColor;margin-right:5px;vertical-align:-1px}
.lkprev{position:sticky;top:-10px;z-index:3;padding:4px 0 10px;background:linear-gradient(180deg,var(--s1) 88%,transparent)}
.peekbtn{display:block;width:100%;margin:2px 0 6px;padding:9px;border-radius:12px;background:var(--s2);border:1px dashed var(--vio);font-weight:700;font-size:13px}
body.peek .sheet{transform:translateY(calc(100% - 46px))!important;transition:transform .3s ease!important}
body.peek .scrim{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
/* emoji picker */
.empk{margin:6px 0 10px}
.emwrap{max-height:250px;overflow-y:auto;overscroll-behavior:contain;border-radius:12px;background:var(--s2);padding:0 6px}
.emh{position:sticky;top:0;z-index:1;font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:6px 2px;background:var(--s2)}
.emg{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px;margin-bottom:6px}
.emg button{font-size:21px;padding:5px 0;border-radius:9px;border:1px solid transparent}
.emg button.on{border-color:var(--cyan);background:color-mix(in srgb,var(--cyan) 18%,transparent)}.emg button:active{transform:scale(.86)}
.emtype{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:6px}.emtype input{padding:9px;font-size:17px}
/* wishlist */
.wi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:10px 11px;border-radius:13px;margin:7px 0;background:linear-gradient(100deg,color-mix(in srgb,var(--c) 20%,var(--s2)),var(--s1));border-left:3px solid var(--c)}
.wi p{margin:0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.wi .d{font-size:11px;color:var(--faint);margin-top:3px}
.wi .b{display:flex;flex-direction:column;gap:5px;align-items:flex-end}.wi .b button{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--s3)}
/* toast + fx */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px) scale(.96);opacity:0;pointer-events:none;z-index:40;width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--vio) 22%,var(--s1));border:1px solid var(--vio);font-size:13.5px;transition:all .3s cubic-bezier(.3,1.4,.5,1);box-shadow:0 16px 40px -16px #000}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
.toast button{color:var(--cyan);font-weight:800;white-space:nowrap}
.burst{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:50;animation:bst .9s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes bst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.conf{position:fixed;top:-12px;width:8px;height:14px;z-index:50;pointer-events:none;animation:cf 2.6s ease-in forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.empty{text-align:center;padding:24px 12px;color:var(--muted)}.empty .e{font-size:42px;display:block;margin-bottom:6px;animation:float 3s ease-in-out infinite}

/* ===== ExamPulse ===== */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
/* hero (Echo) */
.hero{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.hero .ringw{width:120px;height:120px;margin:0}
.hero .ringw .son{inset:10px}
.hero .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hero .rc b{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.hero .rc small{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.hkv{min-width:0}.hkv .lbl{margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;padding:3px 0;color:var(--muted)}.kv b{color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdn{display:block;width:100%;margin-top:7px;padding:7px 8px;border-radius:12px;font-size:11.5px;font-weight:800;text-align:left;color:#ffd98a;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rarc{animation:drawr 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes drawr{from{stroke-dasharray:0 999}}
/* mission */
.miss{display:block;width:100%;text-align:left;border-radius:22px;padding:13px 14px;margin-bottom:12px;background:radial-gradient(260px 120px at 0 0,color-mix(in srgb,var(--c,var(--vio)) 30%,transparent),transparent 70%),linear-gradient(150deg,color-mix(in srgb,var(--c,var(--vio)) 16%,var(--s2)),var(--s1));border:1px solid color-mix(in srgb,var(--c,var(--vio)) 45%,transparent)}
.miss .mt{font-family:var(--disp);font-size:17px;font-weight:800;margin:4px 0 10px;line-height:1.25}
.miss.empty2{border-style:dashed;background:var(--s1)}.miss.empty2 .mt{margin-bottom:0;color:var(--cyan);font-size:15px}
.mbt{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:7px}
.mbt button{padding:10px 6px;border-radius:13px;background:var(--s2);border:1px solid var(--line2);font-weight:800;font-size:12.5px}
.mbt .mgo{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 20px -10px var(--vio)}
/* quick add */
.qa{display:grid;grid-template-columns:22px minmax(0,1fr) 40px 40px;gap:6px;align-items:center;padding:6px 6px 6px 12px;border-radius:18px;background:var(--s1);border:1px solid var(--line2);margin-bottom:14px}
.qa input{background:transparent!important;border:0!important;padding:8px 2px!important;font-size:14px;min-width:0;box-shadow:none!important}
.qa button{height:40px;border-radius:13px;font-size:17px;background:var(--s2)}
.qa .qgo{background:var(--grad);color:#fff}
.qa .qmic.rec{background:var(--dn);animation:glowp 1s infinite}
/* subject tiles */
.st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;overflow:hidden;text-align:left;border-radius:19px;padding:10px 9px 12px;min-height:100px;color:#fff;min-width:0;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) var(--tp,100%),transparent),color-mix(in srgb,var(--c) calc(var(--tp,100%) * .55),color-mix(in srgb,var(--s1) var(--tp,100%),transparent)));
  box-shadow:0 10px 22px -16px var(--c),inset 0 1px 0 rgba(255,255,255,.18);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transition:transform .15s}
.tile::before{content:"";position:absolute;inset:0;background:radial-gradient(110px 70px at 0 0,rgba(255,255,255,.26),transparent 70%);pointer-events:none}
.tile::after{content:"";position:absolute;width:70px;height:70px;right:-24px;bottom:-28px;border-radius:50%;border:10px solid rgba(255,255,255,.09);pointer-events:none}
.tile:active{transform:scale(.94)}
.tile>*{position:relative;z-index:1}
.tile .e{font-size:22px;line-height:1}
.tile .n{font-size:12.5px;font-weight:800;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .h{font-family:var(--disp);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.25}
.tile .s{font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.25)}.tile .pb i{display:block;height:100%;background:rgba(255,255,255,.9);border-radius:0 3px 3px 0}
.tile.lite,.tile.lite *{color:#10131a}
.tile.add{background:var(--s1);border:1.5px dashed var(--line2);box-shadow:none;color:var(--muted)}.tile.add::before,.tile.add::after{display:none}
/* session rows */
.ses{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;width:100%;text-align:left;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.ses:last-child{border:0}
.ses .e{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 25%,var(--s2))}
.ses b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ses .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.ses .v small{display:block;font-size:11px;font-weight:400;letter-spacing:-1px}
/* live timer */
.livec{border-color:color-mix(in srgb,var(--c) 60%,transparent)!important;background:radial-gradient(300px 140px at 100% 0,color-mix(in srgb,var(--c) 26%,transparent),transparent 70%),linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.012)),var(--s1)}
.lvd{font-size:10.5px;font-weight:900;letter-spacing:1.2px;color:var(--c);margin-bottom:6px}.lvd i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:1px;animation:glowp 1s infinite}
.lvt{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvc{font-family:var(--disp);font-size:34px;font-weight:800;line-height:1}
.tpb{height:6px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:10px}.tpb i{display:block;height:100%;background:linear-gradient(90deg,var(--c),#fff);transition:width 1s linear}
.fab.live{background:linear-gradient(135deg,#ff5d73,#c8102e)}
.fab.live::before{background:radial-gradient(circle,rgba(255,93,115,.75),transparent 70%)!important}
/* subject page */
.back{font-weight:800;color:var(--cyan);padding:4px 2px 10px}
.shero{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:radial-gradient(260px 160px at 0 0,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%),linear-gradient(160deg,rgba(255,255,255,.065),rgba(255,255,255,.012)),var(--s1)}
.sav{width:56px;height:56px;border-radius:17px;display:grid;place-items:center;font-size:30px;background:color-mix(in srgb,var(--c) 30%,var(--s2));box-shadow:0 0 20px -6px var(--c)}
.pname{font-family:var(--disp);font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbig{text-align:right}.sbig b{display:block;font-family:var(--disp);font-size:20px}.sbig small{font-size:10.5px;color:var(--muted)}
.topic{display:grid;grid-template-columns:30px minmax(0,1fr) 28px;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.topic:last-of-type{border-bottom:0}
.topic b{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic.done span>b,.topic.done>span:not(.small){text-decoration:line-through;color:var(--faint)}
.ck{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;font-weight:900;font-size:14px;color:#04140c;transition:.2s}
.done>.ck{background:#2ee59d;border-color:#2ee59d}
.tx{color:var(--faint);font-weight:900;font-size:13px;height:28px}
.sylb{height:6px;border-radius:99px;background:var(--s3);overflow:hidden;margin:8px 0 6px}.sylb i{display:block;height:100%;border-radius:99px;animation:growx .8s both;transform-origin:left}
/* tank (old Hydra) */
.tank{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;border-radius:24px;padding:14px;margin-bottom:12px;
  background:radial-gradient(260px 200px at 0 100%,rgba(79,240,210,.18),transparent 70%),linear-gradient(170deg,#0e2533,#081521);border:1px solid rgba(79,240,210,.35)}
.tankv svg{width:120px;height:auto;display:block;overflow:visible}
.water{transition:transform 1.4s cubic-bezier(.2,.9,.3,1)}
.wave1{animation:wave 3.2s linear infinite}.wave2{animation:wave 2.2s linear infinite reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(64px)}}
body.open .wave1,body.open .wave2{animation-play-state:paused}
.tdate{font-size:10.5px;font-weight:900;letter-spacing:1.2px;color:#8ff5e0}
.tbig{font-family:var(--disp);font-size:40px;font-weight:800;line-height:1.05;color:#eafffb}.tbig small{font-size:15px;color:#8ff5e0}
.zone{display:inline-block;margin:7px 0 4px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.tank p{margin:5px 0 0;font-size:12.5px;color:#a9c6cf;line-height:1.35}.tank p b{color:#eafffb}
.tl2{grid-column:1/-1;margin-top:4px}.tl2 .lbl{color:#8ff5e0;margin-bottom:6px}
.tl2 .bar{position:relative;height:16px;border-radius:8px;background:rgba(255,255,255,.07);overflow:hidden}
.tl2 .bar i{position:absolute;top:2px;bottom:2px;border-radius:4px}
.tl2 .bar u{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 6px #fff}
.ax{display:flex;justify-content:space-between;font-size:9.5px;color:#7fa3ad;margin-top:3px}
.tank .legend{color:#a9c6cf}
/* glossy log tiles */
.lg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lt{position:relative;overflow:hidden;border-radius:22px;min-width:0;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 85%,#fff 15%),color-mix(in srgb,var(--c) 55%,#000));box-shadow:0 14px 26px -16px var(--c),inset 0 1px 0 rgba(255,255,255,.35);animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.lt::before{content:"";position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0));pointer-events:none}
.ltm{display:block;width:100%;text-align:left;padding:12px 12px 6px;color:#fff;position:relative}
.ltm:active{transform:scale(.97)}
.lt .ic{font-size:26px;line-height:1}
.lt .n{font-weight:800;font-size:13.5px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt .v{font-family:var(--disp);font-size:26px;font-weight:800;line-height:1.1}.lt .v small{font-size:12px;font-weight:700;opacity:.85}
.lt .s{font-size:11px;opacity:.85}
.ltp{display:block;width:calc(100% - 16px);margin:2px 8px 9px;padding:7px;border-radius:12px;background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:12px;position:relative}
/* plan */
.exs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding-bottom:2px}.exs::-webkit-scrollbar{display:none}
.exc{flex:none;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;min-width:190px;max-width:240px;padding:11px 13px;border-radius:18px;background:linear-gradient(150deg,rgba(255,176,32,.2),var(--s1));border:1px solid rgba(255,176,32,.4)}
.exc b{grid-row:1;font-family:var(--disp);font-size:30px;line-height:1;color:#ffd98a}.exc small{grid-row:2;grid-column:1;font-size:10px;color:var(--muted);text-align:center}
.exc>span{grid-row:1/3;grid-column:2;font-size:12.5px;font-weight:800;line-height:1.3}.exc>span .faint{font-weight:600}
.exc.past{opacity:.55}.exc.add{min-width:74px;grid-template-columns:1fr;background:var(--s1);border:1.5px dashed var(--line2);text-align:center}.exc.add b{color:var(--muted);font-size:24px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:6px}
.wk div{text-align:center;padding:7px 0;border-radius:13px;background:var(--s1);border:1px solid var(--line)}
.wk small{display:block;font-size:10px;color:var(--faint);font-weight:700}.wk b{font-family:var(--disp);font-size:16px}.wk i{display:block;font-style:normal;font-size:9.5px;color:var(--cyan);min-height:12px}
.wk .td{background:color-mix(in srgb,var(--vio) 25%,var(--s1));border-color:var(--vio)}
.dayh{font-size:11.5px;color:var(--muted);font-weight:800;margin:14px 4px 6px;letter-spacing:.4px}
.plr{display:grid;grid-template-columns:30px minmax(0,1fr) 38px;gap:9px;align-items:center;padding:9px 10px;border-radius:15px;margin-bottom:6px;border-left:3px solid var(--c);background:linear-gradient(100deg,color-mix(in srgb,var(--c) 13%,var(--s2)),var(--s1))}
.plm{text-align:left;min-width:0}.plm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plr.done .plm b{text-decoration:line-through;color:var(--faint)}
.plgo{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;font-size:14px}
.strat{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:13px;background:var(--s2);margin-bottom:6px;font-size:13.5px;line-height:1.4;border-left:3px solid var(--cyan)}
/* stats */

<script>
(() => {
'use strict';
/* ===================== config ===================== */
const KEY = 'exampulse.v1', MIN = 60000, DAY = 86400000;
const DEF_SUBS = [['abm','ABM','📘','#7c5cff','Advanced Bank Management'],['bfm','BFM','📗','#2ec5ff','Bank Financial Management'],['abfm','ABFM','📙','#ff4fa3','Advanced Business & Financial Mgmt'],['brbl','BRBL','⚖️','#ffb020','Banking Regulations & Business Laws'],['elec','Elective','🏦','#1fd68a','Elective paper']]
  .map(([id, n, e, c, full]) => ({id, n, e, c, full, topics:[]}));
const ENERGY = [['drained','Drained','🪫','#ff5d73',1],['low','Low','😮‍💨','#ffb020',2],['okay','Okay','🙂','#2ec5ff',3],['high','High','⚡','#2ee59d',4],['peak','Peak','🚀','#ff4fa3',5]];
const DEF_FEELS = [['focused','Focused','🎯','#2ec5ff'],['confident','Confident','💪','#2ee59d'],['motivated','Motivated','🤩','#ffc54d'],['calm','Calm','😌','#4ff0d2'],['anxious','Anxious','😰','#ffb020'],['sleepy','Sleepy','😴','#ff9a3c'],['frustrated','Frustrated','😤','#ff5d73'],['overwhelmed','Overwhelmed','🤯','#a58cff'],['bored','Bored','🥱','#8a9bb0']].map(([id, n, e, c]) => ({id, n, e, c}));
const DEF_BTNS = [['pomo','Pomodoro','🍅','#ff9a3c',25,'study'],['deep','Deep focus','🧠','#38c8ff',50,'study'],['rev','Revision','🔁','#a58cff',30,'revision'],['mock','Mock test','📝','#4ff0d2',120,'mock'],['yt','YouTube','▶️','#ff3b5c',20,'video']].map(([id, n, e, c, m, k]) => ({id, n, e, c, m, k}));
const KINDS = [['study','📖 Study'],['revision','🔁 Revision'],['practice','✍️ Practice'],['video','▶️ YouTube'],['mock','📝 Mock test']];
const STRAT_CATS = [['daily','Daily rules','☀️'],['revision','Revision cycle','🔁'],['lowenergy','Low-energy plan','🪫'],['examday','Exam day','🎯'],['other','Notes','📝']];
const PAL = ['#7c5cff','#2ec5ff','#ff4fa3','#ffb020','#1fd68a','#9b3fd6','#f0428f','#ff6a13','#12a874','#e8364a','#f59f00','#3d63e0','#0aa6d6','#8a3ffc'];
const fresh = () => ({exams:[{id:'x1', n:'CAIIB · Elective', date:'2026-12-27'}], subjects:DEF_SUBS.map(s => ({...s, topics:[]})), feels:DEF_FEELS.map(f => ({...f})), btns:DEF_BTNS.map(b => ({...b})),
  sessions:[], mcqs:[], v11:1, plan:[], strategy:[{id:'g1', cat:'daily', text:'Study the hardest paper first, while energy is high.'},{id:'g2', cat:'revision', text:'Revise each topic on day 1, day 3, day 7 and day 21 after first study.'},{id:'g3', cat:'lowenergy', text:'Low energy? Do a 25-minute revision or MCQs instead of new topics.'},{id:'g4', cat:'examday', text:'Attempt the questions you are sure of first; leave long numericals for the second pass.'}],
  goal:{min:180, max:240, start:'05:00', end:'22:00'}, timer:null, settings:{sound:true}, wish:[]});

/* ===================== state ===================== */
let S;
try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); S = d && Array.isArray(d.sessions) ? {...fresh(), ...d, v11:d.v11 || 0, goal:{...fresh().goal, ...(d.goal || {})}, settings:{...fresh().settings, ...(d.settings || {})}} : fresh(); } catch(e) { S = fresh(); }
let warned = false;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { if (!warned) { warned = true; toast('Could not save on this device'); } } };
if (!Array.isArray(S.mcqs)) S.mcqs = [];
if (!S.v11) { if (!S.btns.some(b => b.k === 'video')) S.btns.push({id:'yt', n:'YouTube', e:'▶️', c:'#ff3b5c', m:20, k:'video'}); S.v11 = 1; setTimeout(save, 0); }
const UI = {tab:'today', tedit:false, sub:null, pseg:'plan', range:30, scat:'all'};

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pk = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dk(new Date());
const addK = (k, n) => { const d = pk(k); d.setDate(d.getDate() + n); return dk(d); };
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const hm = t => { const d = new Date(t), h = d.getHours(); return `${h % 12 || 12}:${pad(d.getMinutes())} ${h < 12 ? 'AM' : 'PM'}`; };
const t12s = s => { const [h, m] = String(s).split(':').map(Number); return `${h % 12 || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
const short = k => { const d = pk(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const longDay = k => { const d = pk(k); return `${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`; };
const dur = m => { m = Math.round(m); return m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? ' ' + pad(m % 60) + 'm' : ''}` : `${m}m`; };
const clockT = ms => { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`; };
const ago = t => { const m = Math.round((Date.now() - t) / MIN); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : m < 1440 ? `${Math.floor(m / 60)}h ${pad(m % 60)}m ago` : `${Math.floor(m / 1440)}d ago`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const lightOf = hex => { const h = String(hex || '').replace('#', ''); if (h.length < 6) return 0; const [r, g, b] = [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) / 255); return .2126 * r + .7152 * g + .0722 * b; };
const sub = id => S.subjects.find(s => s.id === id) || {id, n:'General', e:'📚', c:'#646a9e', topics:[]};
const feel = id => S.feels.find(f => f.id === id) || {id, n:id, e:'•', c:'#646a9e'};
const en = id => ENERGY.find(e => e[0] === id) || ENERGY[2];
const dayOf = t => dk(new Date(t));
const minsOn = k => S.sessions.filter(s => dayOf(s.start) === k).reduce((a, s) => a + s.mins, 0) + (S.timer && dayOf(S.timer.start) === k ? timerMs() / MIN : 0);
const mcqOn = (k, id) => S.sessions.filter(s => (!k || dayOf(s.start) === k) && (!id || s.sub === id)).reduce((a, s) => a + (s.mcq || 0), 0) + S.mcqs.filter(x => (!k || dayOf(x.t) === k) && (!id || x.sub === id)).reduce((a, x) => a + x.n, 0);
const mcqFrom = (from, id) => S.sessions.filter(s => dayOf(s.start) >= from && (!id || s.sub === id)).reduce((a, s) => a + (s.mcq || 0), 0) + S.mcqs.filter(x => dayOf(x.t) >= from && (!id || x.sub === id)).reduce((a, x) => a + x.n, 0);
const vidFrom = (from, id, to = '9999') => S.sessions.filter(s => s.kind === 'video' && dayOf(s.start) >= from && dayOf(s.start) <= to && (!id || s.sub === id)).reduce((a, s) => a + s.mins, 0);
const sessOn = k => S.sessions.filter(s => dayOf(s.start) === k);
const enScore = s => s.energy && s.energy.length ? avg(s.energy.map(e => en(e)[4])) : null;
const syl = s => s.topics.length ? Math.round(s.topics.filter(t => t.done).length / s.topics.length * 100) : null;
const subMins = (id, from = '0000') => S.sessions.filter(s => s.sub === id && dayOf(s.start) >= from).reduce((a, s) => a + s.mins, 0);
function streak(){ let n = 0, k = today(); if (minsOn(k) < 1) k = addK(k, -1); while (minsOn(k) >= 1) { n++; k = addK(k, -1); } return n; }
function bestStreak(){ const days = [...new Set(S.sessions.map(s => dayOf(s.start)))].sort(); let b = 0, r = 0, p = null; days.forEach(k => { r = p && addK(p, 1) === k ? r + 1 : 1; b = Math.max(b, r); p = k; }); return b; }
const nextExam = () => S.exams.filter(x => x.date >= today()).sort((a, b) => a.date.localeCompare(b.date))[0];
const daysTo = k => Math.round((pk(k) - pk(today())) / DAY);
const timerMs = (now = Date.now()) => { const T = S.timer; if (!T) return 0; return T.acc + (T.paused ? 0 : now - T.since); };
const atTime = s => { const [h, m] = s.split(':').map(Number), d = new Date(); d.setHours(h, m, 0, 0); return d.getTime(); };

/* ===================== render ===================== */
let lastTab = 'today';
const TABS = ['today','tank','plan','stats'];
function render(anim = true){
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.t === UI.tab));

let AC = null, ECHO = null;
function snd(kind){
  if (!S.settings.sound) return;
  try {
    if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); const d = AC.createDelay(), f = AC.createBiquadFilter(), fb = AC.createGain(), wet = AC.createGain();
      d.delayTime.value = .17; f.type = 'lowpass'; f.frequency.value = 2600; fb.gain.value = .3; wet.gain.value = .45; d.connect(f); f.connect(fb); fb.connect(d); f.connect(wet); wet.connect(AC.destination); ECHO = d; }
    if (AC.state === 'suspended') AC.resume();
    const now = AC.currentTime, tone = (fr, st, du, type = 'sine', g = .07, f2) => { const o = AC.createOscillator(), gn = AC.createGain(); o.type = type; o.frequency.setValueAtTime(fr, now + st); if (f2) o.frequency.exponentialRampToValueAtTime(f2, now + st + du);
      gn.gain.setValueAtTime(0, now + st); gn.gain.linearRampToValueAtTime(g, now + st + .012); gn.gain.exponentialRampToValueAtTime(.0001, now + st + du); o.connect(gn); gn.connect(AC.destination); gn.connect(ECHO); o.start(now + st); o.stop(now + st + du + .05); };
    if (kind === 'start') { tone(523, 0, .2, 'triangle', .06); tone(784, .08, .25, 'triangle', .06); tone(1047, .16, .35, 'sine', .05); }
    else if (kind === 'next') { tone(784, 0, .1, 'triangle', .06); tone(988, .07, .12, 'triangle', .06); tone(1319, .14, .22, 'sine', .05); }
    else if (kind === 'pause') { tone(700, 0, .25, 'sine', .06, 260); }
    else if (kind === 'finish') [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .6, 'triangle', .06));
    else if (kind === 'tap') tone(1320, 0, .05, 'sine', .03);
    else if (kind === 'tab') { tone(900, 0, .06, 'sine', .03); tone(1320, .04, .07, 'sine', .025); }
    else if (kind === 'sheet') tone(660, 0, .09, 'sine', .03);
    else if (kind === 'save') { tone(520, 0, .3, 'sine', .06, 1040); tone(1560, .12, .2, 'sine', .03); }
    else if (kind === 'del') tone(300, 0, .25, 'sawtooth', .04, 80);
    else if (kind === 'err') tone(160, 0, .2, 'square', .03);
    else if (kind === 'theme') [392, 523, 659, 784].forEach((f, i) => tone(f, i * .06, .4, 'triangle', .045));
  } catch(e) {}
}
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e) {} };
function burstAt(el, col){ if (!el) return; const r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  for (let i = 0; i < 16; i++) { const d = document.createElement('i'), a = Math.random() * Math.PI * 2, s = 30 + Math.random() * 60; d.className = 'burst'; d.style.cssText = `left:${x}px;top:${y}px;background:${i % 3 ? col : '#fff'};--dx:${Math.cos(a) * s}px;--dy:${Math.sin(a) * s}px`; document.body.appendChild(d); setTimeout(() => d.remove(), 950); } }
function confetti(n = 70){ const cols = ['#2ec5ff','#7c5cff','#ff4fa3','#ffc54d','#2ee59d']; for (let i = 0; i < n; i++) { const d = document.createElement('i'); d.className = 'conf'; d.style.cssText = `left:${Math.random() * 100}vw;background:${cols[i % 5]};animation-delay:${Math.random() * .6}s;animation-duration:${2 + Math.random() * 1.4}s`; document.body.appendChild(d); setTimeout(() => d.remove(), 4200); } }

/* ---------- quick add: "45m ABM statistics, tired but focused" ---------- */
function parseQuick(txt){
  let t = ' ' + txt.toLowerCase() + ' ', mins = null;
  const hm2 = t.match(/(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours)\b(?:\s*(\d+)\s*(m|min|mins|minutes)\b)?/), mm = t.match(/(\d+)\s*(m|min|mins|minutes)\b/);
  if (hm2) { mins = Math.round(parseFloat(hm2[1]) * 60 + (hm2[3] ? +hm2[3] : 0)); t = t.replace(hm2[0], ' '); } else if (mm) { mins = +mm[1]; t = t.replace(mm[0], ' '); }
  let subId = null; for (const s of S.subjects) { const keys = [s.n, s.full || ''].filter(Boolean).map(x => x.toLowerCase()); const k = keys.find(x => x && new RegExp('\\b' + x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b').test(t)); if (k) { subId = s.id; t = t.replace(new RegExp('\\b' + k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b'), ' '); break; } }
  const EW = {drained:'drained', exhausted:'drained', low:'low', tired:'low', okay:'okay', ok:'okay', fine:'okay', high:'high', fresh:'high', energetic:'high', peak:'peak', charged:'peak'}, energy = [], feels = [];
  Object.entries(EW).forEach(([w, id]) => { const r = new RegExp('\\b' + w + '\\b'); if (r.test(t)) { if (!energy.includes(id)) energy.push(id); t = t.replace(r, ' '); } });
  S.feels.forEach(f => { const r = new RegExp('\\b' + f.n.toLowerCase() + '\\b'); if (r.test(t)) { feels.push(f.id); t = t.replace(r, ' '); } });
  let mcq = null; const mq = t.match(/(\d+)\s*(mcqs?|questions?|qs)\b/); if (mq) { mcq = +mq[1]; t = t.replace(mq[0], ' '); }
  let kind = 'study'; if (/\b(revision|revise|revised)\b/.test(t)) { kind = 'revision'; t = t.replace(/\b(revision|revise|revised)\b/, ' '); } else if (/\b(youtube|yt|video|videos|lecture)\b/.test(t)) { kind = 'video'; t = t.replace(/\b(youtube|yt|video|videos|lecture)\b/g, ' '); } else if (/\bmock\b/.test(t)) { kind = 'mock'; t = t.replace(/\bmock( test)?\b/, ' '); }
  const topic = t.replace(/\b(but|and|felt|feeling|very|bit|a|so)\b/g, ' ').replace(/[,.;]+/g, ' ').replace(/\s+/g, ' ').trim();
  return {mins, mcq, sub:subId, energy, feels, kind, topic:topic ? topic[0].toUpperCase() + topic.slice(1) : ''};
}
let REC = null;
function quickMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return toast('Voice typing isn\'t available here. Use the keyboard mic.');
  if (REC) { REC.stop(); return; }
  REC = new SR(); REC.lang = 'en-IN'; REC.interimResults = false;
  REC.onresult = e => { const i = $('qaIn'); if (i) i.value = Array.from(e.results).map(r => r[0].transcript).join(' '); };
  REC.onend = () => { REC = null; const b = $('qMic'); if (b) b.classList.remove('rec'); snd('tap'); };
  try { REC.start(); const b = $('qMic'); if (b) b.classList.add('rec'); snd('start'); } catch(e) { REC = null; }
}

function seedDemo(){
  const T = {abm:['Statistics','HRM','Credit Management','Compliance in banks'], bfm:['Risk Management','Basel III','Treasury','Balance sheet mgmt'], abfm:['Capital budgeting','Valuation','Mergers'], brbl:['SARFAESI Act','Banking Regulation Act','Contract Act'], elec:['Rural credit','Priority sector','Financial inclusion']};
  S.subjects.forEach(s => { s.topics = (T[s.id] || []).map((n, i) => ({id:s.id + i, n, done:i === 0})); });
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280, ids = S.subjects.map(s => s.id), fs = S.feels.map(f => f.id), es = ENERGY.map(e => e[0]);
  for (let d = 20; d >= 0; d--) { if (rnd() < .15 && d) continue; const k = addK(today(), -d), n = 2 + Math.floor(rnd() * 3); let t = pk(k).getTime() + (5.5 + rnd()) * 3600000;
    for (let i = 0; i < n; i++) { const su = ids[Math.floor(rnd() * ids.length)], mins = [25, 45, 50, 60, 30][Math.floor(rnd() * 5)]; if (d === 0 && t + mins * MIN > Date.now()) break;
      const e1 = es[1 + Math.floor(rnd() * 4)], kind = rnd() < .08 ? 'mock' : rnd() < .25 ? 'revision' : 'study';
      S.sessions.push({id:'s' + d + '_' + i, sub:su, topic:T[su][Math.floor(rnd() * T[su].length)], mins:kind === 'mock' ? 120 : mins, kind, energy:rnd() < .3 ? [e1, es[Math.floor(rnd() * 5)]] : [e1], feels:[fs[Math.floor(rnd() * 4)], rnd() < .5 ? fs[4 + Math.floor(rnd() * 5)] : fs[0]].filter((x, j, a) => a.indexOf(x) === j), und:2 + Math.floor(rnd() * 4), remark:'', score:kind === 'mock' ? 55 + Math.floor(rnd() * 25) : null, start:t});
      t += (mins + 20 + rnd() * 60) * MIN; } }
  for (let d = 9; d >= 0; d--) { const k = addK(today(), -d); for (let j = 0; j < 2; j++) { if (rnd() < .3) continue; const su = ids[Math.floor(rnd() * ids.length)], n = [10, 20, 25, 30, 50][Math.floor(rnd() * 5)]; const t = pk(k).getTime() + (7 + j * 6 + rnd() * 3) * 3600000; if (t > Date.now()) continue; S.mcqs.push({id:'m' + d + j, sub:su, n, ok:Math.round(n * (.55 + rnd() * .4)), t, topic:''}); }
    if (rnd() < .5) { const t = pk(k).getTime() + 21.5 * 3600000; if (t < Date.now()) { const su = ids[Math.floor(rnd() * ids.length)]; S.sessions.push({id:'v' + d, sub:su, topic:T[su][0] + ' explained', mins:[15, 20, 30, 40][Math.floor(rnd() * 4)], kind:'video', energy:['okay'], feels:['calm'], und:3, remark:'', score:null, start:t}); } } }
  S.plan = [{id:'p1', sub:'bfm', topic:'Risk Management', date:today(), time:'19:00', mins:60, done:false},{id:'p2', sub:'brbl', topic:'SARFAESI Act', date:today(), time:'21:00', mins:45, done:false},{id:'p3', sub:'abfm', topic:'Capital budgeting', date:addK(today(), 1), time:'06:00', mins:60, done:false},{id:'p4', sub:'abm', topic:'Statistics', date:addK(today(), -1), time:'', mins:45, done:false}];
  S.settings.sound = false;
}
